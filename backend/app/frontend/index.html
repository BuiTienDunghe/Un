<script>
/* Chạy TRƯỚC lần vẽ đầu (common.js nạp defer, tới sau): áp theme + cờ hiệu ứng từ lac.prefs để người
   dùng theme tối không thấy một nháy nền sáng. common.js vẫn là chủ và áp lại y hệt.
   Watchdog: script không nạp được (common.js 404, shell.js lỗi) thì html[data-booting] không bao giờ
   được gỡ → trang trắng mãi; hiện một câu báo lỗi thay vào. shell.js tự gỡ câu này nếu khởi động xong. */
(function () {
  var root = document.documentElement;
  try {
    var p = JSON.parse(localStorage.getItem("lac.prefs") || "{}") || {};
    var dark = p.theme === "dark" || (p.theme !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "dark" : "light");
    root.setAttribute("data-motion", p.motion === false ? "off" : "on");
  } catch (e) { /* bộ nhớ bị chặn hoặc lac.prefs hỏng: để common.js quyết */ }
  function fail() {
    if (!root.hasAttribute("data-booting") || document.getElementById("boot-fail")) return;
    var box = document.createElement("div");
    box.id = "boot-fail";
    box.setAttribute("role", "alert");
    box.style.cssText = "position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;text-align:center;"
      + "font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg,#f4f6fb);color:var(--text,#0f172a)";
    box.textContent = "Không khởi động được giao diện — tải lại trang để thử lại.";
    document.body.appendChild(box);
  }
  function shellLoaded() {
    try { return typeof Shell !== "undefined" && !!Shell; } catch (e) { return false; }
  }
  window.addEventListener("load", function () {
    setTimeout(function () { if (!shellLoaded()) fail(); }, 3000);
    setTimeout(fail, 60000);   // mọi bước khởi động đều có hạn chờ (tổng ≤ 45 s); quá 60 s là kẹt thật
  });
})();
</script>
