# ──────────────────────────────────────────────────────────────────────────────
# models.yaml  –  LLM model configuration
#
# SWITCHING PROVIDERS
# -------------------
# Each model slot has a `provider` field. Change it (and the `name`) to route
# that slot to a different backend. Restart the server after any change.
#
#   provider: ollama    → local Ollama server (OLLAMA_BASE_URL in .env)
#   provider: gemini    → Google Gemini API   (GEMINI_API_KEY in .env)
#   provider: deepseek  → DeepSeek API        (DEEPSEEK_API_KEY in .env)
#
# QUICK-SWITCH EXAMPLES (copy one block over the active `general` slot):
#
#   # --- Gemini ---
#   general:
#     provider: gemini
#     name: gemini-2.0-flash         # or gemini-2.5-pro, gemini-2.5-flash
#     temperature: 0.4
#     top_p: 0.9
#     max_tokens: 8192
#
#   # --- DeepSeek ---
#   general:
#     provider: deepseek
#     name: deepseek-chat            # or deepseek-reasoner (R1/V4 reasoning model)
#     temperature: 0.4
#     top_p: 0.9
#     max_tokens: 8192
#
#   # --- Ollama (local) ---
#   general:
#     provider: ollama
#     name: qwen3.5:9b
#     context: 16384
#     temperature: 0.4
#     top_p: 0.9
#     think: false
#     keep_alive: 5m
# ──────────────────────────────────────────────────────────────────────────────

models:
  # ── ACTIVE CONFIGURATION ─────────────────────────────────────────────────
  general:
    provider: ollama
    name: qwen3.5:9b
    context: 16384
    temperature: 0.4
    top_p: 0.9
    think: false
    keep_alive: 5m
  embedding:
    # Embedding only works with provider: ollama
    provider: ollama
    name: qwen3-embedding:0.6b
    context: 32768
    # Cache identity — all three keys are required for the PostgreSQL
    # embedding cache to engage. Bump `revision` whenever the underlying
    # model weights change; cached vectors are then safely invalidated.
    # `dimensions` must match the model's output size or lookups miss.
    revision: qwen3-embedding-0.6b-r1
    normalization: raw
    dimensions: 1024
  vision:
    provider: ollama
    name: qwen3.5:9b
    context: 16384
    temperature: 0.3
    keep_alive: 5m
  ocr:
    # OCR only works with provider: ollama (vision_chat API)
    provider: ollama
    name: glm-ocr:latest
    enabled: true
    context: 16384
    temperature: 0.1
    keep_alive: 5m
    prompt: "Text Recognition:"
    dpi: 200
    min_text_characters: 80
    min_alphanumeric_ratio: 0.45

rag:
  # Token budgets. The built-in Unicode tokenizer is deterministic; benchmark these
  # values against the selected embedding model before changing them.
  chunk_tokens: 480
  chunk_overlap_tokens: 80
  top_k: 5
  max_context_chunks: 5
  retrieval_mode: hybrid
  rrf_k: 60
  # P4-2 contextual retrieval (Anthropic): at INDEX time the general model
  # writes a short situating context per chunk; embedding and BM25 index
  # context+content while citations keep showing the bare content. OFF until
  # the D1 eval proves it on this corpus (plan §1: RAG-quality changes only
  # become default after eval). Costs N general-model calls per indexing run —
  # enable on the heavy machine, re-index, then measure (docs/p4_progress.md).
  contextual_retrieval:
    enabled: false
    context_tokens: 80
    document_char_cap: 12000
  # Rewrite follow-up questions into standalone form before retrieval.
  # Costs one extra (short, capped) general-model call per follow-up turn;
  # first turns and single-question calls never condense.
  condense_enabled: true
  reranker:
    enabled: false
    provider: sentence-transformers
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    candidate_limit: 15

agent:
  # Agent mode (P2-2): the general model may call in-house tools (documents,
  # memory, system status) before answering. `max_steps` bounds tool ROUNDS per
  # answer — each round costs one extra general-model call, so keep it small
  # on CPU. Tool outputs are clipped to `tool_result_max_chars` before they
  # re-enter the prompt.
  max_steps: 3
  # 4 excerpt x ~400 ky tu + metadata JSON ~ 2000+ ky tu; tran thap hon se cat
  # giua chung JSON (model van doc duoc nhung mat doan cuoi).
  tool_result_max_chars: 2400

storage:
  # Original source files are retained by default. Only documents explicitly marked
  # `temporary` and not pinned are eligible for source-artifact cleanup.
  temporary_sources_ttl_days: 0
  ocr_runs_ttl_days: 14
  logs_ttl_days: 7
  ingestion_ttl_days: 7
  cleanup_interval_hours: 24
  superseded_version_grace_days: 7
  # PostgreSQL backups: how often the backup worker dumps, how long dumps are
  # kept, and how many newest dumps survive rotation regardless of age (an
  # installation left idle must never rotate down to zero recovery points).
  backup_interval_hours: 24
  backups_ttl_days: 14
  backups_keep_minimum: 3
