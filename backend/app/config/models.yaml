# ──────────────────────────────────────────────────────────────────────────────
# models.yaml  –  RAG / agent / storage policy (no model names live here)
#
# MODEL NAMES MOVED to model_versions.yaml (same directory): every role —
# general, condenser, embedding, vision, ocr, reranker, extractor, verifier —
# is a versioned record there with one `active` pointer per role, and
# Settings.load_models() serves the active version's `config:` block verbatim,
# so the flat keys the code reads (name, provider, temperature, context, ...)
# are unchanged. Switching provider or model = edit that pointer (or set
# MODEL_VERSION_<ROLE>=<id> in the shell for one machine) and restart.
#   cd backend && python -m app.config.model_registry --check   # CI runs this
#
# What stays here is policy that names no model: rag.* (chunk budgets,
# retrieval mode, contextual retrieval, injection defense, reranker on/off and
# candidate_limit), agent.*, storage.*. load_config()/load_storage_config()
# read it exactly as before. Restart the server after any change.
# ──────────────────────────────────────────────────────────────────────────────

rag:
  # Token budgets. The built-in Unicode tokenizer is deterministic; benchmark these
  # values against the selected embedding model before changing them.
  chunk_tokens: 480
  chunk_overlap_tokens: 80
  top_k: 5
  max_context_chunks: 5
  retrieval_mode: hybrid
  rrf_k: 60
  # P4-2 contextual retrieval (Anthropic): at INDEX time the general model
  # writes a short situating context per chunk; embedding and BM25 index
  # context+content while citations keep showing the bare content. ON since
  # 21/08/2026 — the D1 eval earned it on this corpus (MRR 0.734 -> 0.797,
  # cross-doc recall 0.750 -> 1.000, no case regressed; docs/p4_progress.md).
  # Costs one general-model call per chunk at INDEX time and nothing at answer
  # time. Turning it off is safe but only takes effect on the next re-index:
  # chunks already carrying a context keep it until their version is replaced.
  # CI pins this off — its runner has no generation model (.github/workflows/ci.yml).
  # Per-environment override: RAG_CONTEXTUAL_RETRIEVAL_ENABLED in .env
  # (CI = false, operating machine = unset/true) — see DEVELOPMENT_PLAN.md 3e.
  contextual_retrieval:
    enabled: true
    context_tokens: 80
    document_char_cap: 12000
  # Rewrite follow-up questions into standalone form before retrieval.
  # Costs one extra (short, capped) general-model call per follow-up turn;
  # first turns and single-question calls never condense.
  condense_enabled: true
  # D5 prompt-injection defense: wraps every retrieved passage / tool result in
  # data-not-instructions delimiters and appends one rule to the RAG system
  # prompt + agent guide. Prompt text only, zero extra model calls. ON since
  # 22/08/2026 — measured on the heavy machine's lab session with
  # scripts/redteam_rag.py: attack_success_rate 0.143 -> 0.000, benign controls
  # 1.0, and D1 retrieval + grounding unchanged to the digit with the defense on
  # (docs/d5_redteam.md). Takes effect on the next API start; no re-index.
  # Per-machine override: RAG_INJECTION_DEFENSE_ENABLED.
  injection_defense:
    enabled: true
  # P4-3 reranker: a cross-encoder rescores the RRF candidates at QUERY time.
  # ON since 21/08/2026 — the D1 eval earned it (recall 0.915 -> 0.976, MRR
  # 0.797 -> 0.858, all 7 remaining P4-2 misses fixed; docs/p4_progress.md).
  # Costs no extra GENERATION call, so the inference budget is untouched; it
  # costs latency: +35ms p50 on /rag/search with a GPU, +990ms without one.
  # Needs the optional extra AND a CUDA build of torch:
  #   pip install -e ".[rerank]"
  #   pip install --index-url https://download.pytorch.org/whl/cu128 "torch==2.9.1+cu128"
  # A machine that cannot do that pins RAG_RERANKER_ENABLED=false in .env; one
  # that turns this on without the extra is refused at startup, not at question
  # time. CI pins this off (.github/workflows/ci.yml). candidate_limit 30 was
  # measured and lost to 15 on every quality metric as well as on latency.
  reranker:
    enabled: true
    provider: sentence-transformers
    candidate_limit: 15

agent:
  # Agent mode (P2-2): the general model may call in-house tools (documents,
  # memory, system status) before answering. `max_steps` bounds tool ROUNDS per
  # answer — each round costs one extra general-model call, so keep it small
  # on CPU. Tool outputs are clipped to `tool_result_max_chars` before they
  # re-enter the prompt.
  max_steps: 3
  # 4 excerpt x ~400 ky tu + metadata JSON ~ 2000+ ky tu; tran thap hon se cat
  # giua chung JSON (model van doc duoc nhung mat doan cuoi).
  tool_result_max_chars: 2400

storage:
  # Original source files are retained by default. Only documents explicitly marked
  # `temporary` and not pinned are eligible for source-artifact cleanup.
  temporary_sources_ttl_days: 0
  ocr_runs_ttl_days: 14
  logs_ttl_days: 7
  ingestion_ttl_days: 7
  cleanup_interval_hours: 24
  superseded_version_grace_days: 7
  # PostgreSQL backups: how often the backup worker dumps, how long dumps are
  # kept, and how many newest dumps survive rotation regardless of age (an
  # installation left idle must never rotate down to zero recovery points).
  backup_interval_hours: 24
  backups_ttl_days: 14
  backups_keep_minimum: 3
