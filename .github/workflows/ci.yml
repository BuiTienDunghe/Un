name: CI

# Every pull request and every push to main. `workflow_dispatch` allows a
# manual re-run from the Actions tab without an empty commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No dependencies needed: compileall only parses and byte-compiles.
      - name: Byte-compile every Python source
        run: python -m compileall -q backend/app backend/alembic backend/tests discord_bot tests tools

      # The web UI has no build step, so a parser is the only thing standing
      # between a typo and a blank page in the browser.
      - name: Syntax-check the frontend scripts
        run: |
          for file in backend/app/frontend/*.js; do
            node --check "$file"
          done

      # The only dependency this job needs, and only for the step below.
      - name: Install PyYAML
        run: pip install "PyYAML>=6.0,<7.0"

      - name: Check the YAML configuration files parse
        run: python -c "import yaml;[yaml.safe_load(open(p,encoding='utf-8')) for p in ('backend/app/config/models.yaml','docker-compose.yml','.github/workflows/ci.yml')]"

      # tomllib is stdlib on 3.11, so this costs no dependency.
      - name: Check pyproject.toml parses
        run: python -c "import tomllib;tomllib.load(open('pyproject.toml','rb'))"

  backend-tests:
    name: Backend tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: local_ai_core_test
          POSTGRES_USER: local_ai
          POSTGRES_PASSWORD: local_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_ai -d local_ai_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # /health counts Qdrant among its required components, so the suite needs
      # a real one. Same image as docker-compose.yml, and no --health-cmd: the
      # Qdrant image ships no shell tools to run one with.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      # conftest.py refuses any database whose name does not end in `_test`.
      POSTGRES_TEST_URL: postgresql+psycopg://local_ai:local_ai@127.0.0.1:5432/local_ai_core_test
      DATABASE_URL: postgresql+psycopg://local_ai:local_ai@127.0.0.1:5432/local_ai_core_test
      # Redis database 15 is the test namespace, exactly as in docs/integration_testing.md.
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
      REDIS_URL: redis://127.0.0.1:6379/15
      RQ_QUEUE_PREFIX: local-ai:ci
      QDRANT_URL: http://127.0.0.1:6333

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # T6: sentence-transformers/PyTorch left the mandatory dependencies (they
      # only serve the reranker, installable via `.[rerank]`; since P4-3 it is ON
      # by default but every test/CI path pins it off), so no CPU-torch
      # preinstall trick is needed anymore.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `--no-deps` keeps the CPU-only torch installed above in place; the point
      # here is that the two-root package mapping still resolves.
      - name: Verify the editable install
        run: pip install -e . --no-deps

      - name: Apply migrations to the test database
        run: python -m alembic upgrade head

      # Schema regression gate: a model that gains an index, a nullable change
      # or a constraint without a matching migration fails here, not in
      # production. DATABASE_URL is already set at job level for env.py.
      - name: Check the models match the migrated schema
        run: python -m alembic check

      # Polled from the runner because the container cannot health-check itself.
      - name: Wait for Qdrant to accept requests
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6333/readyz > /dev/null \
              || curl -sf http://127.0.0.1:6333/ > /dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in 120s" >&2
          exit 1

      - name: Run the backend test suite
        # `python -m pytest` from backend/ puts the app package on sys.path,
        # which is how the suite is run everywhere else (docs/integration_testing.md).
        working-directory: backend
        run: python -m pytest tests -q

      # Migration tests walk the database backwards; a teardown that restores a
      # pinned revision instead of head leaves every later test running against
      # a stale schema. Fail loudly here rather than in an unrelated test.
      - name: Assert the test database is back at head
        run: python -m alembic current | grep -q "(head)"

  retrieval-eval:
    # D1 gate: the multi-document retrieval eval, retrieval-only so the job
    # needs the 0.6b embedding model and no generation model. It fails on a
    # drop of more than the harness tolerance below its baseline.
    #
    # The shipped defaults are contextual retrieval ON (P4-2: general model at
    # INDEX time — 6.6GB this job cannot afford, 27 CPU generations past the
    # 30-minute timeout) and the cross-encoder reranker ON (P4-3: needs the
    # [rerank] extra this job does not install). So the job deliberately turns
    # BOTH flags OFF and gates the BARE retrieval path against
    # rag_multidoc_baseline_bare.json. That still protects what CI can protect:
    # embedding + BM25 + RRF. The shipped configuration's own baseline lives in
    # rag_multidoc_baseline.json and is measured on the heavy machine
    # (docs/d1_retrieval_eval.md, docs/p4_progress.md).
    name: Retrieval eval gate (D1, bare index)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: local_ai_core_eval
          POSTGRES_USER: local_ai
          POSTGRES_PASSWORD: local_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_ai -d local_ai_core_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql+psycopg://local_ai:local_ai@127.0.0.1:5432/local_ai_core_eval
      REDIS_URL: redis://127.0.0.1:6379/14
      RQ_QUEUE_PREFIX: local-ai:ci-eval
      QDRANT_URL: http://127.0.0.1:6333

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the editable install
        run: pip install -e . --no-deps

      - name: Apply migrations to the eval database
        run: python -m alembic upgrade head

      - name: Wait for Qdrant to accept requests
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6333/readyz > /dev/null \
              || curl -sf http://127.0.0.1:6333/ > /dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in 120s" >&2
          exit 1

      # The pulled model blobs are ~640MB; cache them keyed on the embedding
      # cache identity from models.yaml so a revision bump refetches.
      - name: Cache the Ollama embedding model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen3-embedding-0.6b-r1

      - name: Install and start Ollama with the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 2
          done
          ollama pull qwen3-embedding:0.6b

      # Measured on purpose, not by accident. Without this the shipped defaults
      # would apply: contextual retrieval would call a generation model this
      # runner does not have (27 failed calls degrading to the same bare index),
      # and the reranker would need the [rerank] extra this job does not
      # install. Pinning both states the intent in the diff.
      #
      # It fails loudly when a key cannot be found, so renaming or moving a flag
      # cannot silently turn this into a no-op that measures the wrong config.
      - name: Pin index-time and query-time RAG flags off for the bare gate
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("backend/app/config/models.yaml")
          text = path.read_text(encoding="utf-8")
          for key in ("contextual_retrieval", "reranker"):
              # Match this key's own `enabled:` line whatever its current value —
              # the point is to force false, not to assert today's default.
              pattern = re.compile(rf"(?m)^(  {key}:\n(?:    \w[^\n]*\n)*?    enabled: )(true|false)$")
              found = pattern.findall(text)
              if len(found) != 1:
                  raise SystemExit(f"expected exactly one rag.{key}.enabled in {path}, found {len(found)}")
              was = found[0][1]
              text = pattern.sub(lambda match: match.group(1) + "false", text, count=1)
              print(f"rag.{key}.enabled pinned false (was {was})")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/models > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become ready in 120s" >&2
          tail -50 /tmp/api.log >&2
          exit 1

      - name: Run the retrieval eval gate
        working-directory: backend
        run: >-
          python -m scripts.evaluate_rag
          --multidoc-dataset ../data/evaluation/rag_multidoc_eval.jsonl
          --retrieval-only
          --baseline ../data/evaluation/rag_multidoc_baseline_bare.json

  bot-tests:
    name: Bot and tools tests (Windows)
    # Windows is the deployment target for the launcher and the control panel,
    # and this job also proves requirements.txt still installs cleanly there.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the editable install
        run: pip install -e . --no-deps

      # Proves the two import roots resolve from outside the repository, which
      # is the only thing `pip install -e .` is actually promising here.
      - name: Verify the package mapping resolves
        working-directory: ${{ runner.temp }}
        run: python -c "import app, discord_bot, tools.discord_bot_control; print(app.__version__)"

      # These tests need no service: they cover the Discord API client, the bot
      # control policy, the canonical Discord location rules and the packaging
      # contract.
      - name: Run the bot and tools test suite
        run: python -m pytest tests -q
