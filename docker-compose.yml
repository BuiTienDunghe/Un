services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_ai_core}
      POSTGRES_USER: ${POSTGRES_USER:-local_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
  redis:
    image: redis:7-alpine
    profiles: ["workers"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  # Model registry (backend/app/config/model_versions.yaml) is baked into the
  # image with backend/, so a registry edit reaches these workers only after
  # `docker compose build`.
  # Settings (backend/app/config/settings.py) holds every default. A Settings
  # field is passed through as a bare key (`VAR:`): compose copies it from the
  # shell or .env, and when neither sets it the variable is absent in the
  # container, so Settings decides. A default written here drifts from Settings
  # (the extractor schema version did: v1 here, v2 there), and on a
  # MODEL_VERSION_* pin it would pin every container to one version forever.
  # The one exception is the rq queue name on `command:`: the rq CLI needs it
  # before any Settings exists, so it keeps Settings' own default there
  # (backend/tests/test_compose_defaults.py fails if the two ever differ).
  worker-ocr:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:ocr
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_VERSION_EXTRACTOR:
      MODEL_VERSION_VERIFIER:
      MODEL_VERSION_EMBEDDING:
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  worker-index:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:index
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_VERSION_EXTRACTOR:
      MODEL_VERSION_VERIFIER:
      MODEL_VERSION_EMBEDDING:
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  worker-memory:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:${DISCORD_MEMORY_QUEUE_NAME:-memory_extract}
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DISCORD_MEMORY_INGESTION_ENABLED:
      DISCORD_MEMORY_EXTRACTOR_ENABLED:
      # Unset = follow roles.extractor.active in the registry; a tag = ad-hoc pin.
      DISCORD_MEMORY_EXTRACTOR_MODEL:
      MODEL_VERSION_EXTRACTOR:
      MODEL_VERSION_VERIFIER:
      MODEL_VERSION_EMBEDDING:
      DISCORD_MEMORY_EXTRACTOR_SCHEMA_VERSION:
      DISCORD_MEMORY_EXTRACTOR_NUM_CTX:
      DISCORD_MEMORY_EXTRACTOR_TIMEOUT_SECONDS:
      DISCORD_MEMORY_EXTRACTOR_RETRY_COUNT:
      DISCORD_MEMORY_QUEUE_NAME:
      JOB_STALE_TIMEOUT_SECONDS:
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  outbox-dispatcher:
    build: .
    profiles: ["workers"]
    command: python -m scripts.outbox_dispatcher
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX:
      JOB_MAX_ATTEMPTS:
    depends_on: [redis]
  cleanup-worker:
    build: .
    profiles: ["workers"]
    command: python -m scripts.cleanup_worker --loop
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      QDRANT_URL: http://qdrant:6333
      REQUEST_LOG_RETENTION_DAYS:
    volumes: ["./data:/app/data"]
    depends_on: [qdrant]
  discord-bot:
    build: .
    profiles: ["discord"]
    command: python -m discord_bot.main
    # Bare keys, as for the backend services: an unset variable is absent in the
    # container and discord_bot/main.py's own default applies, so there is one
    # default per variable, not two that can drift.
    environment:
      DISCORD_TOKEN:
      DISCORD_CLIENT_ID:
      DISCORD_INVITE_URL:
      LOCAL_AGENT_BASE_URL:
      LOCAL_AGENT_USERNAME:
      LOCAL_AGENT_PASSWORD:
      # Without this a secured backend would 401 every Discord turn.
      LOCAL_AI_API_KEY:
      DISCORD_SYSTEM_PROMPT_PATH: /app/discord_bot/system_prompt.md
      DISCORD_MEMBER_CONTEXT_LIMIT:
      # Deliberately NOT main.py's default (false): the Docker bot runs persistent
      # shared sessions unless .env says otherwise, as the control panel's host bot
      # does (discord_bot/control.py forces it on).
      DISCORD_PERSISTENT_SESSIONS_ENABLED: ${DISCORD_PERSISTENT_SESSIONS_ENABLED:-true}
      DISCORD_BACKEND_TIMEOUT_SECONDS:
      DISCORD_TURN_EXECUTE_TIMEOUT_SECONDS:
      # memory_design.md 13.6 job 1: channels whose traffic is counted (no content).
      DISCORD_LISTEN_CHANNEL_IDS:
    extra_hosts:
      - "api:host-gateway"
    volumes:
      - ./discord_bot/system_prompt.md:/app/discord_bot/system_prompt.md:ro
      # The passive counter file must survive container recreation.
      - ./data:/app/data

volumes:
  postgres_data:
