services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_ai_core}
      POSTGRES_USER: ${POSTGRES_USER:-local_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
  redis:
    image: redis:7-alpine
    profiles: ["workers"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker-ocr:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:ocr
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX: ${RQ_QUEUE_PREFIX:-local-ai:dev}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  worker-index:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:index
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX: ${RQ_QUEUE_PREFIX:-local-ai:dev}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  worker-memory:
    build: .
    profiles: ["workers"]
    command: rq worker --with-scheduler --url redis://redis:6379/0 ${RQ_QUEUE_PREFIX:-local-ai:dev}:${DISCORD_MEMORY_QUEUE_NAME:-memory_extract}
    environment:
      INGESTION_EXECUTION_BACKEND: rq
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX: ${RQ_QUEUE_PREFIX:-local-ai:dev}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DISCORD_MEMORY_INGESTION_ENABLED: ${DISCORD_MEMORY_INGESTION_ENABLED:-false}
      DISCORD_MEMORY_EXTRACTOR_ENABLED: ${DISCORD_MEMORY_EXTRACTOR_ENABLED:-false}
      DISCORD_MEMORY_EXTRACTOR_MODEL: ${DISCORD_MEMORY_EXTRACTOR_MODEL:-qwen3.5:2b}
      DISCORD_MEMORY_EXTRACTOR_SCHEMA_VERSION: ${DISCORD_MEMORY_EXTRACTOR_SCHEMA_VERSION:-v1}
      DISCORD_MEMORY_EXTRACTOR_NUM_CTX: ${DISCORD_MEMORY_EXTRACTOR_NUM_CTX:-4096}
      DISCORD_MEMORY_EXTRACTOR_TIMEOUT_SECONDS: ${DISCORD_MEMORY_EXTRACTOR_TIMEOUT_SECONDS:-60}
      DISCORD_MEMORY_EXTRACTOR_RETRY_COUNT: ${DISCORD_MEMORY_EXTRACTOR_RETRY_COUNT:-1}
      DISCORD_MEMORY_QUEUE_NAME: ${DISCORD_MEMORY_QUEUE_NAME:-memory_extract}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-900}
    volumes: ["./data:/app/data"]
    depends_on: [redis]
  outbox-dispatcher:
    build: .
    profiles: ["workers"]
    command: python -m scripts.outbox_dispatcher
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_PREFIX: ${RQ_QUEUE_PREFIX:-local-ai:dev}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    depends_on: [redis]
  cleanup-worker:
    build: .
    profiles: ["workers"]
    command: python -m scripts.cleanup_worker --loop
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
      QDRANT_URL: http://qdrant:6333
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-7}
    volumes: ["./data:/app/data"]
    depends_on: [qdrant]
  discord-bot:
    build: .
    profiles: ["discord"]
    command: python -m discord_bot.main
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-1522310732912398527}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-https://discord.com/oauth2/authorize?client_id=1522310732912398527}
      LOCAL_AGENT_BASE_URL: ${LOCAL_AGENT_BASE_URL:-http://api:8000}
      LOCAL_AGENT_USERNAME: ${LOCAL_AGENT_USERNAME:-}
      LOCAL_AGENT_PASSWORD: ${LOCAL_AGENT_PASSWORD:-}
      # Without this a secured backend would 401 every Discord turn.
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      DISCORD_SYSTEM_PROMPT_PATH: /app/discord_bot/system_prompt.md
      DISCORD_MEMBER_CONTEXT_LIMIT: ${DISCORD_MEMBER_CONTEXT_LIMIT:-100}
      DISCORD_PERSISTENT_SESSIONS_ENABLED: ${DISCORD_PERSISTENT_SESSIONS_ENABLED:-true}
      DISCORD_BACKEND_TIMEOUT_SECONDS: ${DISCORD_BACKEND_TIMEOUT_SECONDS:-45}
      DISCORD_TURN_EXECUTE_TIMEOUT_SECONDS: ${DISCORD_TURN_EXECUTE_TIMEOUT_SECONDS:-180}
    extra_hosts:
      - "api:host-gateway"
    volumes:
      - ./discord_bot/system_prompt.md:/app/discord_bot/system_prompt.md:ro

volumes:
  postgres_data:
